services:
  - type: web
    name: zuhriddin-ecommerce-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SHOP_WRITE_API_KEY
        generateValue: true
